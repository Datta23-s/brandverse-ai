# BrandverseAI — evaluation request set (30 requests = 10 brands x 3 campaigns)
#
# Design and rules: docs/evaluation-plan.md (D1-D5, RQ1-RQ3; RQ2a and RQ2b are blocking).
# D4 option (a): real product specifications under pseudonymised brand and product names.
#
# CLAIMS ARE PROPOSED, NOT ENTERED. Every claim below was read from the manufacturer's own product
# record on retrieved_at, at evidence_url. claim_type is a PROPOSAL for the human who enters
# product_claims (Phase 3); it is not a verification by this file.
#   verified   — objective, manufacturer-stated spec (dimension, quantity, rating, material).
#   restricted — health, medical, superlative or "first" claim with no independent source on the
#                page (Rules.md T2, T3). These are kept deliberately: the claim gate must block
#                them, so they are test material.
#   conflicts  — sources disagree. Neither value is entered as verified.
#   gaps       — information the claim needs that the page does not state.
#
# real_* fields exist so claims can be checked. Generated output uses pseudonyms only (Rules.md T8).

# category (per product, added 2026-10-28): the product's GENERIC category, the only product term the query
# planner may use (brands and products are pseudonyms no search engine can resolve: V7). Authored by the
# developer from what each request describes, untuned, like every other input here; no brand or product
# name appears in one. Frozen by evaluation/test_set.categories.lock.
retrieved_at: 2026-10-14
budget_tier: standard        # identical for every request, so budget is not a confound

campaign_pattern:
  1: "Product A, cold start (no memory for this brand)"
  2: "Product B: same brand, related product (brand and sector memory available)"
  3: "Product A again, new objective (product, brand and sector memory available)"

