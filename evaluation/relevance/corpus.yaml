# Relevance corpus: marketing memory for three fictional brands (docs/evaluation-plan.md section 7).
# Drafted 2026-10-25 by a session instructed to read brief.md and nothing else (its own report lists no
# other file); it was never shown the 50 queries or the pool. This replaces the first corpus, which was
# drafted with the queries in view and is kept in superseded/reversed-order/. Only id and text are read by the pool builder.
- id: mp-01
  brand: mettlepan
  kind: insight
  text: "Mettlepan is a direct-to-consumer cookware brand from Bengaluru, positioned in the mid-premium band. Its promise is cookware for people moving away from non-stick coatings, built in tri-ply stainless steel and pre-seasoned cast iron."
- id: mp-02
  brand: mettlepan
  kind: persona
  text: "Young couples setting up a first kitchen are a core Mettlepan customer. They want a small set of durable pieces that will last years, rather than a cupboard of cheap pans they will replace, and they look for guidance on what to buy first."
- id: mp-03
  brand: mettlepan
  kind: persona
  text: "Health-conscious home cooks replacing non-stick are a core Mettlepan audience. They worry about worn coatings and fumes at high heat, read up on materials before buying, and want reassurance that stainless and cast iron are easy to live with."
- id: mp-04
  brand: mettlepan
  kind: persona
  text: "Gift buyers around weddings and festivals form a third Mettlepan customer type. They are often not cooks themselves, so they need a clear, recognisable gift choice, good presentation and simple wording about what the set contains and why it lasts."
- id: mp-05
  brand: mettlepan
  kind: persona
  text: "Mettlepan's health-conscious buyers are usually cautious switchers who fear food will stick on stainless steel or that cast iron is hard to maintain. Content that shows the first few cooks step by step addresses the worry that stops them buying."
- id: mp-06
  brand: mettlepan
  kind: persona
  text: "First-kitchen couples at Mettlepan often decide together and compare options across the website and marketplaces before ordering. They value clear set contents, honest descriptions of what each piece is for, and reviews from people in a similar situation."
- id: mp-07
  brand: mettlepan
  kind: competitor
  text: "Ironvale is a cast-iron specialist competing with Mettlepan, and its strength is a heritage story about traditional foundry craft. It is credible with cast-iron purists but offers little in stainless steel, so Mettlepan can lead with a broader everyday range."
- id: mp-08
  brand: mettlepan
  kind: competitor
  text: "Cookhaus is the mass-market non-stick competitor to Mettlepan and is known for frequent sales and promotion-led advertising. Mettlepan does not match it on price messaging and instead speaks to buyers who are tired of coatings that wear out."
- id: mp-09
  brand: mettlepan
  kind: competitor
  text: "Against Ironvale, Mettlepan should avoid a contest over who has the older tradition. The better contrast is that Mettlepan pre-seasons its cast iron and pairs it with stainless, so a new cook can start cooking on the first day."
- id: mp-10
  brand: mettlepan
  kind: competitor
  text: "Cookhaus wins on convenience and low entry cost, which is why Mettlepan never claims that its pans are as effortless as non-stick. It frames the extra care as a short, learnable habit that rewards the cook with cookware that lasts."
- id: mp-11
  brand: mettlepan
  kind: competitor
  text: "Buyers who compare Mettlepan with Cookhaus on marketplace listings tend to judge on coating worry and longevity, while those comparing with Ironvale judge on craft and weight. Mettlepan listings should address both comparisons directly and calmly."
- id: mp-12
  brand: mettlepan
  kind: insight
  text: "Mettlepan's voice is practical, warm, and a little proud of doing things the slow way. Copy explains how a thing works, uses everyday kitchen words, and treats patience with a pan as a pleasure rather than a chore."
- id: mp-13
  brand: mettlepan
  kind: insight
  text: "Mettlepan copy avoids fear-based language about non-stick coatings. It states what its materials are and what they offer, and lets the customer draw the conclusion, because alarmist wording clashes with the warm, practical voice of the brand."
- id: mp-14
  brand: mettlepan
  kind: insight
  text: "The biggest barrier in Mettlepan's category is fear of the learning curve: food sticking on stainless and rust on cast iron. Knowledge that removes this fear, such as heat control and seasoning habits, matters more than product specifications."
- id: mp-15
  brand: mettlepan
  kind: insight
  text: "Mettlepan treats its own website as the place for depth, with care guides, recipes and set explanations, while marketplaces are where many first-time buyers discover and compare. The website carries the full story and the marketplace listing carries the essentials."
- id: mp-16
  brand: mettlepan
  kind: insight
  text: "Indian home cooking is heavy on high-heat tempering, frying and flatbread making, so Mettlepan cookware is best presented through familiar dishes. Showing a kadai with a real sabzi or a tawa with rotis is more convincing than abstract material talk."
- id: mp-17
  brand: mettlepan
  kind: insight
  text: "Wedding and festival gifting is a recurring seasonal pattern in Mettlepan's category. The brand keeps gifting messages centred on lasting value and the start of a household, and never on urgency or pressure to buy."
- id: mp-18
  brand: mettlepan
  kind: insight
  text: "Mettlepan's two marketplaces serve shoppers who arrive with a search term such as tawa or kadai, so product titles should name the item and its material plainly. The brand's slower, proud voice shows up in the description, not the title."
- id: mp-19
  brand: mettlepan
  kind: claim
  text: "Mettlepan's stainless cookware uses a tri-ply build: an aluminium core sandwiched between two layers of stainless steel. The core spreads heat across the base and up the sides, which helps reduce hot spots when cooking."
- id: mp-20
  brand: mettlepan
  kind: claim
  text: "The Mettlepan tri-ply stainless kadai is a deep, wide-mouthed pan with two riveted handles, designed for frying, tempering and curries. Its stainless cooking surface is suitable for metal utensils and for cooking on gas and induction hobs."
- id: mp-21
  brand: mettlepan
  kind: claim
  text: "Mettlepan's tri-ply stainless saucepans have a tight-fitting lid and a pouring rim, and are meant for boiling milk, making tea, cooking dal and reheating. They are made from the same tri-ply construction as the kadai."
- id: mp-22
  brand: mettlepan
  kind: claim
  text: "The Mettlepan cast-iron tawa and skillet come pre-seasoned, which means a baked-on layer of oil is applied at the factory so the pan can be used soon after washing. Users are still advised to keep seasoning it through regular cooking."
- id: mp-23
  brand: mettlepan
  kind: claim
  text: "Mettlepan cast iron is heavy and holds heat for a long time, which suits rotis, dosas and searing. Because of the weight, the product descriptions say so openly and point out the helper handle on the skillet."
- id: mp-24
  brand: mettlepan
  kind: claim
  text: "The Mettlepan first kitchen set has three pieces: a tri-ply stainless kadai with lid, a tri-ply stainless saucepan, and a pre-seasoned cast-iron tawa. It is intended to cover everyday Indian cooking for a new household."
- id: mp-25
  brand: mettlepan
  kind: claim
  text: "Mettlepan's care accessories are a cleaning scrub and a seasoning oil. The scrub is for removing stuck-on food without stripping seasoning from cast iron, and the oil is a thin food-safe coating applied after drying to maintain the pan."
- id: mp-26
  brand: mettlepan
  kind: claim
  text: "Mettlepan stainless steel pieces are non-reactive, so cooking tomato or tamarind based dishes does not alter taste. This is a material property of food-grade stainless steel, and the brand states it without suggesting any health benefit."
- id: mp-27
  brand: mettlepan
  kind: claim
  text: "Mettlepan's cast-iron cookware should be dried promptly after washing and lightly oiled to prevent rust. The brand states this plainly in its care guidance, because honesty about upkeep builds more trust than claiming the pans are maintenance-free."
- id: mp-28
  brand: mettlepan
  kind: claim
  text: "Mettlepan stainless pieces carry no non-stick coating of any kind, so there is no layer to chip or flake. The brand can say its stainless range is coating-free, but it does not compare itself with named non-stick makers."
- id: mp-29
  brand: mettlepan
  kind: claim
  text: "Mettlepan states that its cast iron is not dishwasher safe and that harsh detergent should be avoided on seasoned surfaces. Its stainless pieces tolerate dishwashing, though hand washing is recommended to keep the finish looking new."
- id: mp-30
  brand: mettlepan
  kind: creative
  text: "Recipe content from Instagram and YouTube creators has been the strongest format for Mettlepan, because viewers see a real dish cooked in the pan from start to finish. Creators who cook everyday food convert better than polished studio films."
- id: mp-31
  brand: mettlepan
  kind: creative
  text: "Mettlepan's seasoning and care explainers, shown as short step-by-step videos, have consistently drawn saves and questions. They work because they remove the fear of owning cast iron, and they suit short vertical formats well."
- id: mp-32
  brand: mettlepan
  kind: creative
  text: "Creative that dramatises the problem of peeling non-stick pans has drawn comments but often reads as scolding. The team learned to show the pleasure of cooking in steel or iron instead of attacking the old pan."
- id: mp-33
  brand: mettlepan
  kind: creative
  text: "Slow-cooking and patience themes, such as a long simmer or a tawa heating up before the first roti, fit Mettlepan's proud-of-the-slow-way voice and have been well received. Fast, hype-driven edits feel off-brand."
- id: mp-34
  brand: mettlepan
  kind: creative
  text: "Marketplace listing imagery for Mettlepan works best with a clear first image of the pan on white, followed by images showing size, handle detail, base construction and a dish in the pan. Lifestyle shots belong after the practical ones."
- id: mp-35
  brand: mettlepan
  kind: creative
  text: "Gift-focused Mettlepan creative performs best when it shows the first kitchen set as a complete, boxed present with a short note about what each piece does. Generic festive imagery without product detail has been less effective."
- id: mp-36
  brand: mettlepan
  kind: creative
  text: "Mettlepan has found that comparison-table graphics between stainless, cast iron and non-stick are widely shared, provided they stay neutral and factual. Tables that rank products with clear winners and losers draw distrust."
- id: mp-37
  brand: mettlepan
  kind: creative
  text: "Customer kitchen photographs, such as a well-used seasoned tawa or a scratched but loved kadai, add credibility to Mettlepan's pages. They show that the cookware ages gracefully, which supports the long-lasting promise."
- id: mp-38
  brand: mettlepan
  kind: sector
  text: "Cookware sold in India must be suitable for contact with food, and Mettlepan should only state that its pieces are food grade where it holds supporting material specifications. Material descriptions on listings must match the actual alloy and build."
- id: mp-39
  brand: mettlepan
  kind: sector
  text: "In kitchenware marketing, claims such as toxin-free, chemical-free or healthier cooking are risky unless they can be substantiated. Mettlepan describes materials and construction factually and avoids implied medical or health outcomes."
- id: mp-40
  brand: mettlepan
  kind: sector
  text: "Marketplaces in India require accurate listing details for cookware, including material, dimensions, weight and compatible hobs. Mettlepan keeps these fields consistent with the website and package, so that returns and complaints about mismatch are avoided."
- id: zv-01
  brand: zarvik
  kind: insight
  text: "Zarvik Nutrition makes plant-based supplements for urban Indian adults who train two to four times a week. It sits at a mid price point and presents itself as a dependable everyday option, not an extreme performance or transformation brand."
- id: zv-02
  brand: zarvik
  kind: persona
  text: "Gym-goers who avoid dairy are a core Zarvik audience. They may be lactose intolerant, vegetarian or simply dairy-averse, are tired of whey-based defaults, and want a protein that digests comfortably and tastes acceptable when mixed with water."
- id: zv-03
  brand: zarvik
  kind: persona
  text: "Runners training for their first half-marathon are a Zarvik persona with distinct needs: hydration on long runs, steady recovery and a manageable routine. They are beginners who read a lot, join running clubs and want practical, non-intimidating advice."
- id: zv-04
  brand: zarvik
  kind: persona
  text: "Working professionals who want a simple daily routine are the third Zarvik customer type. They have little time, dislike complicated stacks, and prefer one or two products that fit into a morning or evening habit without much thought."
- id: zv-05
  brand: zarvik
  kind: persona
  text: "Zarvik's dairy-free gym customers are often sceptical of plant protein because of past experience with chalky texture or an unclear amino acid story. Honest description of what the protein contains and how it mixes earns more trust than superlatives."
- id: zv-06
  brand: zarvik
  kind: persona
  text: "First-time half-marathon runners buying from Zarvik are often guided by a running club, a coach or a fitness creator. They ask peers before buying, so word-of-mouth settings and group recommendations carry more weight than direct advertising."
- id: zv-07
  brand: zarvik
  kind: competitor
  text: "PlantFuel is a plant-based competitor to Zarvik that wins on lower cost and large bulk tubs. Zarvik does not compete on size or cheapness, and instead emphasises ingredient clarity, flavour quality and a clear label."
- id: zv-08
  brand: zarvik
  kind: competitor
  text: "VitaNest is a premium supplement brand sold on pharmacy shelves, and its strength is clinical-sounding authority and pharmacist recommendation. Zarvik differs by being plain-spoken, plant-based and aimed at active adults rather than patients."
- id: zv-09
  brand: zarvik
  kind: competitor
  text: "Against PlantFuel, Zarvik's audience often asks whether the extra spend is justified. The standing answer is about what is in each serving and how it tastes, never a disparaging comparison of the competitor's products or ingredients."
- id: zv-10
  brand: zarvik
  kind: competitor
  text: "Against VitaNest, Zarvik should not imitate medical language or pharmacy-style authority, which would clash with its evidence-minded but plain voice and risk crossing sector rules. It earns credibility through clear labels and cited sources."
- id: zv-11
  brand: zarvik
  kind: competitor
  text: "Zarvik's competitors reach buyers through different doors: PlantFuel through large online tubs and VitaNest through chemists. Zarvik concentrates on its own website, quick-commerce, gyms, running clubs and creators, where its active audience already is."
- id: zv-12
  brand: zarvik
  kind: insight
  text: "Zarvik's voice is plain-spoken, evidence-minded and never preachy. It explains what a product contains and what the evidence says in short sentences, does not lecture about lifestyle, and avoids hype words such as miracle or ultimate."
- id: zv-13
  brand: zarvik
  kind: insight
  text: "Many Zarvik customers are beginners in fitness and nutrition, so the brand avoids jargon and explains terms when it uses them. Education about daily protein habits, hydration and rest builds a relationship before any product mention."
- id: zv-14
  brand: zarvik
  kind: insight
  text: "Quick-commerce apps suit Zarvik's impulse and replenishment purchases, such as an electrolyte pack on the way to a run. Listings there have very little space, so the product name, flavour and serving format must be clear at a glance."
- id: zv-15
  brand: zarvik
  kind: insight
  text: "Gyms and running clubs are trusted community channels for Zarvik. Presence there works through sampling, talks and shared routines, and the brand shows up as a supporter of the group rather than as a salesperson."
- id: zv-16
  brand: zarvik
  kind: insight
  text: "Fitness creators are an important Zarvik channel, but the brand briefs them to share genuine usage and to disclose the partnership. It does not hand creators scripts with health or performance promises that the brand could not itself make."
- id: zv-17
  brand: zarvik
  kind: insight
  text: "Urban Indian adults who train are often confused by supplement marketing that promises rapid transformation. Zarvik's steady, modest and routine-based message stands out, and the team treats restraint as a deliberate brand asset."
- id: zv-18
  brand: zarvik
  kind: insight
  text: "Zarvik's own website is where full ingredient lists, nutrition panels, usage directions and the evidence behind its statements live. Other channels summarise and point back to it so that a sceptical buyer can verify every statement."
- id: zv-19
  brand: zarvik
  kind: claim
  text: "Zarvik's plant protein is a blend of pea protein and rice protein. Combining the two sources gives a broader amino acid profile than either alone, and the product contains no dairy ingredients."
- id: zv-20
  brand: zarvik
  kind: claim
  text: "Zarvik plant protein is sold in two flavours, a chocolate and a vanilla. Both are sweetened and flavoured to be pleasant when shaken with water, and the flavour descriptions must match the label and the ingredients list."
- id: zv-21
  brand: zarvik
  kind: claim
  text: "Zarvik's electrolyte drink mix contains sodium, potassium and magnesium with a small amount of sugar for taste, and is mixed into water. It is described as a way to replace fluids and salts lost through sweat during exercise."
- id: zv-22
  brand: zarvik
  kind: claim
  text: "Zarvik multivitamin gummies are a chewable daily format containing a range of vitamins and are intended for adults. The brand notes they are a supplement to a varied diet and not a replacement for meals."
- id: zv-23
  brand: zarvik
  kind: claim
  text: "Zarvik's sleep-support magnesium powder is a flavoured powder with magnesium, taken in the evening mixed with water. It is positioned as a nutritional supplement that contributes to normal magnesium intake, not as a treatment for sleeplessness."
- id: zv-24
  brand: zarvik
  kind: claim
  text: "Zarvik states clearly that its products are food supplements and are not medicines. They are not intended to diagnose, treat, cure or prevent any disease, and this statement appears on the website and pack."
- id: zv-25
  brand: zarvik
  kind: claim
  text: "Every Zarvik product states a recommended serving and a notice that the stated daily intake should not be exceeded. The brand also advises that supplements should not replace a varied balanced diet and a healthy lifestyle."
- id: zv-26
  brand: zarvik
  kind: claim
  text: "Zarvik lists allergen information on every product page, including soy, nut or gluten traces where they could apply from shared manufacturing facilities. Allergen statements must always match the current pack label exactly."
- id: zv-27
  brand: zarvik
  kind: claim
  text: "Zarvik plant protein is suitable for vegetarians and vegans, and the brand may call it plant-based and dairy-free. It does not claim that plant protein is better than whey, since the evidence supports comparable use rather than superiority."
- id: zv-28
  brand: zarvik
  kind: creative
  text: "Zarvik's best-received creative explains one thing at a time, such as what electrolytes do during a long run, in a calm and simple format. Dense infographics packed with several claims are saved less and questioned more."
- id: zv-29
  brand: zarvik
  kind: creative
  text: "Before-and-after body imagery is off limits for Zarvik. It conflicts with the never-preachy voice and with sector rules on implied outcomes, and the team uses everyday training, routines and ingredients as visual material instead."
- id: zv-30
  brand: zarvik
  kind: creative
  text: "Long-run and training-block diaries by running club members have worked well for Zarvik. They are honest, show the electrolyte mix as one part of a routine, and avoid promising that a product produced a result."
- id: zv-31
  brand: zarvik
  kind: creative
  text: "Taste-test and mixing videos for Zarvik plant protein answer the main doubt about texture. Showing the shake being made with water and drunk straight away builds more trust than describing the flavour in words."
- id: zv-32
  brand: zarvik
  kind: creative
  text: "Zarvik's morning and evening routine content, such as a gummy with breakfast or magnesium after dinner, resonates with working professionals. Simple, repeatable habit framing performs better than fitness-intensity framing for this group."
- id: zv-33
  brand: zarvik
  kind: creative
  text: "Creator content for Zarvik works when the creator is a real trainee who explains why they chose a plant-based product. Highly produced testimonials that read like scripts draw scepticism from this audience."
- id: zv-34
  brand: zarvik
  kind: creative
  text: "On quick-commerce listings, Zarvik's cleanest creatives show the pack front, flavour, serving format and one plain descriptor. Crowded banners with several claims are hard to read in small thumbnails."
- id: zv-35
  brand: zarvik
  kind: sector
  text: "In the health supplements sector, Zarvik may not make disease claims. It must never say a product treats, cures, prevents or relieves a condition, and wording about sleep, immunity or recovery has to stay within permitted nutritional descriptions."
- id: zv-36
  brand: zarvik
  kind: sector
  text: "Under the illustrative supplement registry rules Zarvik works to, a health-related statement must be supported by evidence on file, and the team keeps that evidence ready. A claim without a documented basis is not published."
- id: zv-37
  brand: zarvik
  kind: sector
  text: "Zarvik avoids implying guaranteed results such as fast muscle gain, weight loss or better sleep. Statements are phrased as what an ingredient contributes to, and testimonials may not be used to suggest an outcome the brand could not claim itself."
- id: zv-38
  brand: zarvik
  kind: sector
  text: "Supplement advertising must not suggest that a product replaces medical advice or medication. Zarvik copy for the sleep-support powder and multivitamin gummies encourages people with medical conditions or on medication to consult a doctor first."
- id: zv-39
  brand: zarvik
  kind: sector
  text: "Paid partnerships between Zarvik and fitness creators must be clearly disclosed as such, and creators must follow the same claim rules as the brand. Zarvik reviews creator drafts for prohibited health claims before they are posted."
- id: zv-40
  brand: zarvik
  kind: sector
  text: "Zarvik does not target children or make claims aimed at minors, and its gummies are labelled for adult use. Marketing images and creator choices should reflect an adult audience, and products are kept out of youth-oriented placements."
- id: nw-01
  brand: nookwell
  kind: insight
  text: "Nookwell Home sells cotton home textiles for rented city flats: bedsheets, cushion covers and blackout curtains that look good and survive frequent washing. It sits at an affordable to mid price level and speaks to people in small spaces."
- id: nw-02
  brand: nookwell
  kind: persona
  text: "Renters in their twenties furnishing a first flat are Nookwell's central customer. They have a small budget and little space, want the room to feel like theirs without drilling or buying furniture, and often shop on marketplaces."
- id: nw-03
  brand: nookwell
  kind: persona
  text: "Families redecorating for festivals are a Nookwell customer type that refreshes cushion covers, curtains and bedding to welcome guests. They buy in sets, look for coordinated prints, and care that the fabrics will stay colourful after repeated washing."
- id: nw-04
  brand: nookwell
  kind: persona
  text: "Hosts who let out rooms short-term are a third Nookwell customer. They need linen that looks fresh in photographs, washes quickly between guests, and can be bought again in matching sets as items wear."
- id: nw-05
  brand: nookwell
  kind: persona
  text: "Nookwell's young renters tend to move often, so they value items that pack easily, fit standard beds and windows, and work in a new flat. A bundle that covers the basics in one purchase is attractive to them."
- id: nw-06
  brand: nookwell
  kind: persona
  text: "Short-term hosts judge Nookwell on durability and consistency. They wash linen frequently, need colours that do not fade or bleed, and care about being able to reorder the same design so that rooms look uniform."
- id: nw-07
  brand: nookwell
  kind: competitor
  text: "SoftLoom is a premium competitor offering hotel-style linen, and its appeal is luxury feel and high thread count language. Nookwell does not try to be a luxury brand and instead stresses everyday comfort and practical washing."
- id: nw-08
  brand: nookwell
  kind: competitor
  text: "Duvetly is a low-price competitor with a very wide catalogue. Nookwell cannot match its range or its lowest prices, so it competes on a focused, well-made selection of cotton that holds up in repeated washes."
- id: nw-09
  brand: nookwell
  kind: competitor
  text: "Against SoftLoom, Nookwell's advantage is accessibility: good cotton that a renter can afford and replace without worry. Messaging avoids claiming hotel luxury and presents the beds as comfortable, honest and ready for daily life."
- id: nw-10
  brand: nookwell
  kind: competitor
  text: "Against Duvetly, shoppers on marketplaces often see similar-looking listings side by side. Nookwell wins attention with clear fabric descriptions, true-to-colour photographs and visible reviews rather than by matching the breadth of the catalogue."
- id: nw-11
  brand: nookwell
  kind: competitor
  text: "Nookwell sits between SoftLoom and Duvetly, offering better cotton quality than the lowest-cost catalogue and a friendlier cost than hotel-style linen. The team uses this middle position to explain value, never to criticise either rival."
- id: nw-12
  brand: nookwell
  kind: insight
  text: "Nookwell's voice is friendly, unfussy and upbeat about small spaces. Copy talks like a helpful friend who has also lived in a rented flat, uses simple words, and treats a small room as a chance for personality."
- id: nw-13
  brand: nookwell
  kind: insight
  text: "Marketplaces are Nookwell's first channel and its own website comes second. Most first-time buyers discover the brand through marketplace search, so listing titles, images and review quality carry the most weight in winning new customers."
- id: nw-14
  brand: nookwell
  kind: insight
  text: "Nookwell's own website holds the fuller story, including care guides, room ideas and the move-in bundle. It serves returning customers and people who want to see matching items together, while marketplaces handle first discovery."
- id: nw-15
  brand: nookwell
  kind: insight
  text: "Pinterest is the planning channel for Nookwell. People save room ideas and colour palettes there well before buying, so evergreen boards for small bedrooms and rental-friendly decor keep working long after they are posted."
- id: nw-16
  brand: nookwell
  kind: insight
  text: "Instagram home-decor creators show Nookwell products in real small flats, which makes the brand relatable to renters. The best partners style a whole corner, such as a bed with cushions and curtains, rather than a single item."
- id: nw-17
  brand: nookwell
  kind: insight
  text: "Rented-flat constraints shape what Nookwell customers want: no drilling, standard curtain rods, walls they cannot repaint. Product and content that solve decor problems within these limits resonate more than aspirational interior design."
- id: nw-18
  brand: nookwell
  kind: insight
  text: "Festival periods repeatedly bring a shift toward refreshing the home, and Nookwell's seasonal print cushion covers speak to that behaviour. Festival messaging focuses on welcoming guests and refreshing a room without a full renovation."
- id: nw-19
  brand: nookwell
  kind: claim
  text: "Nookwell's bedsheet sets are made from cotton in two weaves, percale and sateen. Percale has a crisp, matte, cool feel, while sateen has a smoother, softer finish with a slight sheen."
- id: nw-20
  brand: nookwell
  kind: claim
  text: "A Nookwell bedsheet set includes a fitted or flat sheet in the stated bed size and matching pillow covers. The set contents and the bed size each product fits must be written plainly on every listing."
- id: nw-21
  brand: nookwell
  kind: claim
  text: "Nookwell bedsheets are described as made to survive frequent washing, and the brand backs this with colourfast dyeing and sturdy stitching. It does not promise they will never fade, and it gives machine-wash guidance on the pack."
- id: nw-22
  brand: nookwell
  kind: claim
  text: "Nookwell cushion covers come in seasonal prints and have a concealed zip so the cover can be removed for washing. Covers are sold without inserts, and the listing states the cover size so buyers can match their own filler."
- id: nw-23
  brand: nookwell
  kind: claim
  text: "Nookwell blackout curtains use a thick, tightly woven, lined fabric that blocks most daylight, which helps with sleeping in a bright room. The brand says they reduce light significantly and does not say they block light completely."
- id: nw-24
  brand: nookwell
  kind: claim
  text: "Nookwell sheer curtains are a light cotton-blend voile that diffuses sunlight and adds some privacy while keeping a room bright. They are designed to be hung alone or layered with a blackout curtain on a double rod."
- id: nw-25
  brand: nookwell
  kind: claim
  text: "Nookwell curtains are made to fit standard window sizes with rod-pocket or eyelet tops, so they hang on common rods without drilling or special fittings. Drop and width are listed on every product."
- id: nw-26
  brand: nookwell
  kind: claim
