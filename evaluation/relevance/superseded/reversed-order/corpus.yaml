# Relevance corpus: marketing memory for three fictional brands (docs/evaluation-plan.md section 7).
# Drafted 2026-10-25 from brief.md WITH the 50 queries in view (queries.lock froze them first).
# Each item is one fact in the form of a memory item (Memory.md section 6): no prices, discounts,
# promo codes, campaign dates, personal data or accented characters. Fictional brands throughout.
# Only id and text are read by the pool builder; brand and kind are for loading memory_items.
- id: mp-01
  brand: mettlepan
  kind: persona
  text: "Couples setting up their first kitchen together want a small set of pans that covers everyday cooking and lasts, bought once rather than replaced. They are practical and watch their budget, and they respond to a plain answer about what they actually need more than to the size of the range."
- id: mp-02
  brand: mettlepan
  kind: persona
  text: "Health-conscious home cooks replacing non-stick pans are often worried about coatings that flake or wear, and about what ends up in their food. They want reassurance that steel and iron are simple and safe, and a plain guide to cooking without food sticking."
- id: mp-03
  brand: mettlepan
  kind: persona
  text: "Gift buyers around weddings and festivals want something useful that the receiver will keep for years. When they cannot judge individual pans, they choose a ready-made set, and their main worry is choosing wrongly."
- id: mp-04
  brand: mettlepan
  kind: persona
  text: "Some cooks like the idea of cast iron but fear rust and upkeep. They need the routine to feel short and forgiving, a minute of care after cooking, not a ritual that has to be done perfectly."
- id: mp-05
  brand: mettlepan
  kind: persona
  text: "Viewers of YouTube recipe creators copy the creator's pan, heat and oil almost exactly. They trust a result they have watched being cooked more than any claim made in words."
- id: mp-06
  brand: mettlepan
  kind: persona
  text: "Marketplace shoppers compare listings side by side and decide from the first image, the list of what is in the pack and a plain description. They rarely visit the brand's own website before buying."
- id: mp-07
  brand: mettlepan
  kind: competitor
  text: "Cookhaus sells mass-market non-stick cookware and is almost always running a sale. Mettlepan does not try to match it on the day. The argument is how long a pan lasts and what it replaces, not being cheaper this week."
- id: mp-08
  brand: mettlepan
  kind: competitor
  text: "People who compare Mettlepan with Cookhaus are usually buying their first pan and judging on the shelf price. Answer with cost over years of use: one steel or iron pan against replacing a coated pan each time the coating wears. Say it calmly and do not run Cookhaus down."
- id: mp-09
  brand: mettlepan
  kind: competitor
  text: "Ironvale is a cast-iron specialist with a strong heritage story, built on tradition and long family use. Mettlepan does not claim heritage. Its position is modern and practical: pre-seasoned, ready to cook with from the first day."
- id: mp-10
  brand: mettlepan
  kind: competitor
  text: "Ironvale's heritage story gives little practical help to someone buying cast iron for the first time. Against it, Mettlepan opens with what a new buyer needs: a pan that arrives seasoned and a simple first-week routine, and leaves the history to Ironvale."
- id: mp-11
  brand: mettlepan
  kind: competitor
  text: "When a competitor is always on sale, do not mention sales in Mettlepan copy, and do not answer a sale with a promotion of our own. Talk about the pan's lasting value and let the comparison stand without a number in it."
- id: mp-12
  brand: mettlepan
  kind: insight
  text: "Never disparage people who cook with non-stick. Acknowledge that it was a sensible choice at the time, then show what changes with steel or iron: heat the pan first, use a little oil, give it a moment. People who feel judged stop reading."
- id: mp-13
  brand: mettlepan
  kind: insight
  text: "Tri-ply stainless is the everyday pan: lighter, even heat, no seasoning, and fine for acidic dishes such as tomato gravies. Cast iron is the heavy heat-holder for searing, rotis and slow cooking, and it improves with use. Present them as two tools for different jobs, not as rivals."
- id: mp-14
  brand: mettlepan
  kind: insight
  text: "Tri-ply steel is washed and dried like any steel pan. Cast iron must be dried straight away and given a thin coat of oil. When explaining the difference between the two, say which routine the reader is signing up for before they choose."
- id: mp-15
  brand: mettlepan
  kind: insight
  text: "The fear that cast iron is too much maintenance is mostly a fear of rust. Answer with the short routine: wipe, dry on the heat, one thin coat of oil. Add that a lapse can be repaired with a scrub and a fresh seasoning, so nothing is ruined by one mistake."
- id: mp-16
  brand: mettlepan
  kind: insight
  text: "Pre-seasoned means the pan can be used from the first day, and the seasoning builds with use. The easiest way to start is to cook dishes with some fat in them for the first week, which also teaches the new owner how the pan behaves."
- id: mp-17
  brand: mettlepan
  kind: insight
  text: "People who throw out non-stick pans often do so after worrying about a scratched coating. Talk to them about what to cook in next, and how steel and iron cook differently: preheat, add oil, be patient. Otherwise a first egg that sticks makes them give up."
- id: mp-18
  brand: mettlepan
  kind: insight
  text: "Most sticking complaints in the first week come from not preheating the pan. A three-step line prevents them: heat the pan first, then add oil, then add food. Put it on the pack insert and in every first-use video."
- id: mp-19
  brand: mettlepan
  kind: claim
  text: "The first-kitchen starter set has three pieces: a tri-ply kadai, a tri-ply saucepan and a pre-seasoned cast-iron tawa. They were chosen to cover everyday Indian cooking for two people."
- id: mp-20
  brand: mettlepan
  kind: insight
  text: "The starter set is for couples furnishing a first kitchen and for people giving them a gift. Lead with 'everything you need to cook your first month' and avoid the word 'basic', which reads as cheap and undersells a set built to last."
- id: mp-21
  brand: mettlepan
  kind: insight
  text: "In festival season the starter set is bought as a gift. Show it as a boxed, ready-to-give set and speak to the giver's worry about choosing right, not to cooking technique. Lead with usefulness and leave offers out of the headline."
- id: mp-22
  brand: mettlepan
  kind: insight
  text: "For wedding gifting the angle is 'the first thing they cook in': a gift that begins a couple's cooking life together. Stress that it will last for years and that a set suits relatives who want to give one joint gift."
- id: mp-23
  brand: mettlepan
  kind: insight
  text: "Gifting copy should name the moment, a new home or a new marriage, before it names any specification. Keep the specifications for the product page beneath the story, where a careful giver will look for them."
- id: mp-24
  brand: mettlepan
  kind: insight
  text: "When talking to a couple, speak to both partners and show two people cooking together. Do not assume who does the cooking. The first-kitchen conversation is about building a shared habit, so pictures of cooking together work better than a single cook."
- id: mp-25
  brand: mettlepan
  kind: claim
  text: "Mettlepan tri-ply cookware has an aluminium core between two layers of stainless steel, which spreads heat across the base and up the sides of the pan."
- id: mp-26
  brand: mettlepan
  kind: claim
  text: "Mettlepan cast-iron tawa and skillet are sold pre-seasoned and can be used without any preparation."
- id: mp-27
  brand: mettlepan
  kind: claim
  text: "Mettlepan tri-ply pans work on induction, gas and electric hobs. The cast-iron pieces also work on all three."
- id: mp-28
  brand: mettlepan
  kind: claim
  text: "Mettlepan cast iron is not dishwasher safe. It should be washed by hand, dried straight away and given a thin coat of oil. The tri-ply pans can be washed in the usual way."
- id: mp-29
  brand: mettlepan
  kind: claim
  text: "Mettlepan's care accessories are a cleaning scrub and a seasoning oil. The oil goes on in a thin coat after drying cast iron, and the scrub removes stuck-on food from both steel and iron."
- id: mp-30
  brand: mettlepan
  kind: insight
  text: "Mettlepan's voice is practical and warm, and a little proud of doing things the slow way. It explains before it sells, and it sounds like a cook who knows the pan, not like an advertisement."
- id: mp-31
  brand: mettlepan
  kind: insight
  text: "Mettlepan is conversational but not slangy: short sentences, 'you' and 'we'. Exclamation marks are rare, at most one in a social post and none on product pages. Formality is that of a helpful neighbour who cooks well."
- id: mp-32
  brand: mettlepan
  kind: insight
  text: "For the slow, careful way Mettlepan makes things, use plain words: made slowly, seasoned with care, properly made, takes time. Avoid 'artisanal' and 'handcrafted' unless a process really is done by hand, and avoid heritage words that belong to Ironvale."
- id: mp-33
  brand: mettlepan
  kind: creative
  text: "On Instagram, Mettlepan posts lead with one picture of food cooking in the pan and one short line, in a lighter tone. The detail of care and specifications stays on the website, so a post never has to carry everything."
- id: mp-34
  brand: mettlepan
  kind: creative
  text: "The Mettlepan website is where the fuller explanations live: care guides, comparisons of tri-ply and cast iron, and specifications. Its tone is a little more careful and complete than Instagram's, and still free of slang."
- id: mp-35
  brand: mettlepan
  kind: creative
  text: "For YouTube recipe creators, give the facts to say, such as preheating, the oil and the heat, and then let them cook. Ask them to show the pan in use rather than read a script, and to say nothing about health beyond what the product page states."
- id: mp-36
  brand: mettlepan
  kind: creative
  text: "Past Instagram posts showing a pan's care routine in under a minute were saved more often than product shots on a plain background. The short routine reassures cast-iron-hesitant cooks before they ask."
- id: mp-37
  brand: mettlepan
  kind: creative
  text: "On marketplace listings the first image shows everything in the starter set laid out together. The bullet list names each piece and who the set is for, because shoppers decide from that image and that list."
- id: mp-38
  brand: mettlepan
  kind: creative
  text: "A before-and-after format works for people leaving non-stick: what I cooked in my old pan, and what I cook in now. It has done better than facts about coatings, because it shows the result instead of arguing about the pan."
- id: mp-39
  brand: mettlepan
  kind: sector
  text: "Kitchenware is not a regulated sector, but words such as 'chemical-free' or 'non-toxic' need support. Describe the materials factually instead: stainless steel, aluminium core, pre-seasoned cast iron."
- id: mp-40
  brand: mettlepan
  kind: sector
  text: "Do not promise that cast iron will never rust or that any pan lasts a lifetime. Say that with care it lasts for years. Absolute promises about durability are the first claims a reviewer will refuse."
- id: zv-01
  brand: zarvik
  kind: persona
  text: "People training for their first half marathon worry about fuelling, cramps and recovery. They want a simple plan for what to take before, during and after a long run, not a lecture, and reassurance that ordinary food comes first."
- id: zv-02
  brand: zarvik
  kind: persona
  text: "Gym-goers who avoid dairy do so for lactose intolerance, digestion or preference. They want protein that suits them, and they do not want to be told what they are missing or made to feel that avoiding dairy is a problem."
- id: zv-03
  brand: zarvik
  kind: persona
  text: "Working professionals who want a simple daily routine prefer one or two products taken at a fixed moment. They make few decisions about supplements and drop anything that feels like a regimen."
- id: zv-04
  brand: zarvik
  kind: persona
  text: "Members of running clubs trust their club-mates more than any advertisement. They pass on practical advice and respond to trying a product at a club session, where they can ask other runners what they think."
- id: zv-05
  brand: zarvik
  kind: persona
  text: "Some lifters have been told that whey is the only serious protein. They want the evidence and the numbers stated plainly, and they are quick to notice a claim that goes further than the data."
- id: zv-06
  brand: zarvik
  kind: persona
  text: "Quick-commerce shoppers order on impulse from small listings and compare in seconds. They need the one-line reason to buy, the flavour and the pack contents on the listing itself."
- id: zv-07
  brand: zarvik
  kind: competitor
  text: "PlantFuel is cheaper and sells plant protein in bulk tubs. Zarvik does not compete on cost per kilo. Compare on what is in each serving, how it tastes and how it mixes, and never attack PlantFuel or its customers."
- id: zv-08
  brand: zarvik
  kind: competitor
  text: "When someone asks why Zarvik costs more than PlantFuel, do not pretend the gap is not there. Acknowledge it, then say plainly what the buyer gets: a defined pea-and-rice blend, two flavours, and clear labelling per serving. Let the buyer decide whether that is worth it."
- id: zv-09
  brand: zarvik
  kind: competitor
  text: "VitaNest is premium and sits on pharmacy shelves, which lends it the authority of the pharmacy. Zarvik cannot borrow that by claiming it. It competes by showing its evidence plainly and by being available where people train."
- id: zv-10
  brand: zarvik
  kind: competitor
  text: "Never suggest that a product is better because it is sold in a pharmacy, or that Zarvik is a medicine. When positioning against VitaNest, say that supplements are not a substitute for medical advice and leave the pharmacy shelf to VitaNest."
- id: zv-11
  brand: zarvik
  kind: competitor
  text: "In gyms, PlantFuel is the bulk buy for people who purchase by the month. Zarvik is the choice for people who train two to four times a week and want a product they like, not the largest tub."
- id: zv-12
  brand: zarvik
  kind: claim
  text: "Zarvik plant protein is a pea-and-rice blend. One serving provides 24 g of protein."
- id: zv-13
  brand: zarvik
  kind: claim
  text: "Zarvik plant protein comes in two flavours, chocolate and vanilla. Chocolate is richer and works well shaken with a plant milk. Vanilla is lighter and blends easily into oats or a smoothie."
- id: zv-14
  brand: zarvik
  kind: insight
  text: "To help someone choose between the two protein flavours: chocolate for a shake after training, vanilla for adding to breakfast or a smoothie. Say that taste is personal and offer the smaller pack to try one first."
- id: zv-15
  brand: zarvik
  kind: claim
  text: "Zarvik electrolyte mix contains sodium, potassium and magnesium, with a small amount of sugar. It is mixed into water."
- id: zv-16
  brand: zarvik
  kind: insight
  text: "The electrolyte mix is for long sessions and hot-weather runs, when someone is sweating a lot, during or after. For a short easy session, plain water is enough, and saying so keeps Zarvik credible."
- id: zv-17
  brand: zarvik
  kind: claim
  text: "Zarvik multivitamin gummies are taken once a day. They are a supplement to a varied diet and not a replacement for one."
- id: zv-18
  brand: zarvik
  kind: insight
  text: "For a daily routine, tie each product to a moment that already exists: protein after a workout, gummies with breakfast, the magnesium powder as part of winding down. A product tied to an existing habit is taken longer than one that needs a new routine."
- id: zv-19
  brand: zarvik
  kind: insight
  text: "For someone starting a new routine, suggest one product first and keep it for four weeks before adding another. People drop off when they are asked to take too much too soon, and a small start keeps the promise honest."
- id: zv-20
  brand: zarvik
  kind: insight
  text: "Say 'plant-based' and 'contains no dairy' plainly. Do not imply that dairy is bad or that people who eat it are wrong. The point for people who avoid dairy is simply that this protein is made for them."
- id: zv-21
  brand: zarvik
  kind: insight
  text: "Do not promise that Zarvik protein will not cause bloating or that it is gentle on every stomach. What can be said is that the blend contains no dairy and no lactose, which is a fact about the ingredients."
- id: zv-22
  brand: zarvik
  kind: insight
  text: "The honest answer to 'plant protein does not work as well as whey' is that both give a complete set of amino acids in a typical serving, and what matters most for results is total daily protein and consistent training. Do not say plant is better. Do not say it is worse."
- id: zv-23
  brand: zarvik
  kind: claim
  text: "Together, pea and rice protein supply all nine essential amino acids, which is why Zarvik uses a blend of the two rather than one source alone."
- id: zv-24
  brand: zarvik
  kind: insight
  text: "For a first half marathon, say that real food comes first. Zarvik fits after long runs, where protein is useful, and during long runs in heat, where electrolytes are. Present neither as required to finish."
- id: zv-25
  brand: zarvik
  kind: insight
  text: "Talk to first-time half marathon runners about finishing, not about a time. Do not promise speed or set pace targets. The message is that preparation and consistency matter more than any product."
- id: zv-26
  brand: zarvik
  kind: claim
  text: "The evidence file on plant versus whey protein cites a single study in resistance-trained adults that compared gains in lean mass and strength over 12 weeks and found no meaningful difference between the two groups. It measured lean mass and strength. It did not measure recovery, soreness or sleep."
- id: zv-27
  brand: zarvik
  kind: insight
  text: "Wording that can be used about plant protein after training: protein after training helps people meet their daily protein needs, as part of a varied diet. Zarvik does not say its protein speeds recovery or reduces soreness, because the evidence on file does not measure either."
- id: zv-28
  brand: zarvik
  kind: creative
  text: "A past post said plant protein 'helps you recover faster'. It was held back at review because the only supporting claim was the protein content per serving, which says nothing about how fast anyone recovers. A cited claim has to say what the sentence says."
- id: zv-29
  brand: zarvik
  kind: claim
  text: "One serving of Zarvik magnesium powder contains 200 mg of magnesium. It is a powder mixed into water, taken in the evening."
- id: zv-30
  brand: zarvik
  kind: claim
  text: "The approved wording on file for magnesium is that it contributes to the reduction of tiredness and fatigue. The wording on file is about tiredness. It is not about sleep."
- id: zv-31
  brand: zarvik
  kind: insight
  text: "Talk about the magnesium powder as part of an evening wind-down routine. Never say it helps you fall asleep, fixes sleep or treats insomnia. Those are health claims, and the evidence on file does not support them."
- id: zv-32
  brand: zarvik
  kind: creative
  text: "A creator draft said the magnesium powder 'knocks you out' and 'fixes your sleep'. It was rejected. The magnesium claim on file is about tiredness and fatigue, and a creator's enthusiasm does not widen it."
- id: zv-33
  brand: zarvik
  kind: sector
  text: "Illustrative rule for the supplements sector (synthetic, not from any regulation): 'miracle cure' is prohibited, and so is any promise of guaranteed results. Protein copy must carry the line that protein content varies by serving size, and all output carries a consult-a-professional line."
- id: zv-34
  brand: zarvik
  kind: sector
  text: "Supplement copy must not state or imply that a product treats, cures or prevents a disease or a medical condition, including insomnia and injury. Describe what a product contains and the approved wording for it, and no more."
- id: zv-35
  brand: zarvik
  kind: insight
  text: "Zarvik is plain-spoken and evidence-minded and never preachy. It uses short sentences, says what a product is and what it contains before what it does, and states a limit when there is one."
- id: zv-36
  brand: zarvik
  kind: insight
  text: "Zarvik never sounds like a hype-driven supplement advertisement, a doctor delivering a lecture, or a wellness influencer handing out guilt. No 'should' or 'must' aimed at the reader, no drama, and no promise bigger than the label."
- id: zv-37
  brand: zarvik
  kind: insight
  text: "Words Zarvik avoids because they sound preachy: clean, pure, toxin-free, guilt-free, detox, biohack, no excuses, and 'you need to'. Replace them with what the product contains, in plain terms."
- id: zv-38
  brand: zarvik
  kind: creative
  text: "In gym partnerships the message is shorter and spoken, in the gym's own voice, so a trainer can repeat it in one sentence. The website carries the labels, the nutrition detail and the evidence. The gym tone is more direct, and the website tone is more complete."
- id: zv-39
  brand: zarvik
  kind: creative
  text: "Fitness creators get a one-page brief: what the products are, what each contains, three things that can be said, and a list of things that must not be said, mainly health claims. They use their own voice and show their real routine."
- id: zv-40
  brand: zarvik
  kind: creative
  text: "A quick-commerce listing carries one line giving the reason to buy, the flavour and what is in the pack, and nothing beyond what is on the label."
- id: nw-01
  brand: nookwell
  kind: persona
  text: "Renters in their twenties furnishing a first flat have a limited budget and cannot change the walls. They want the place to look put together quickly, with pieces that come with them to the next flat."
- id: nw-02
  brand: nookwell
  kind: persona
  text: "Hosts who let out rooms short-term need bedding that looks fresh in photographs, survives constant washing and can be bought again in a matching set. They think in terms of turnaround between guests."
- id: nw-03
  brand: nookwell
  kind: persona
  text: "Families redecorating for a festival refresh cushions, curtains and bedsheets together. They want colour and a festive look without replacing everything in the room."
- id: nw-04
  brand: nookwell
  kind: persona
  text: "Marketplace-first shoppers read the ratings and look at the photographs before anything else. They compare several sets in one sitting and rarely go on to the brand's own website."
- id: nw-05
  brand: nookwell
  kind: persona
  text: "Tenants in small flats care about light, storage and a room that does not feel crowded. They like ideas that work in the space they have and distrust pictures of big rooms."
- id: nw-06
  brand: nookwell
  kind: persona
  text: "Followers of home-decor creators on Pinterest and Instagram save ideas for later. They look for colour palettes, real small rooms and before-and-after changes they could copy in a rental."
- id: nw-07
  brand: nookwell
  kind: competitor
  text: "SoftLoom sells premium, hotel-style linen. Nookwell does not claim hotel quality. It offers good-looking cotton that is easy to wash for real flats, and says so without comparing itself to a hotel bed."
- id: nw-08
  brand: nookwell
  kind: competitor
  text: "When Nookwell is compared with SoftLoom, say what each is for: SoftLoom for a bed that feels like a hotel, Nookwell for a rented flat whose sheets are washed often. Never run SoftLoom down. A fair comparison is more believable."
- id: nw-09
  brand: nookwell
  kind: competitor
  text: "Duvetly has the lowest prices and a very wide catalogue. Nookwell cannot win on being cheapest or on breadth. It competes on cotton quality, a smaller set of well-chosen designs, and how the fabric looks after many washes."
- id: nw-10
  brand: nookwell
  kind: competitor
  text: "When someone compares Nookwell's prices with Duvetly's, acknowledge the difference and then talk about cost over time: sheets that keep their shape and colour after repeated washing. Keep numbers out of the answer."
- id: nw-11
  brand: nookwell
  kind: competitor
  text: "Duvetly's wide catalogue can overwhelm a first-time renter. Present Nookwell's smaller range as a plus: fewer choices, and they go together, so the room comes together without a styling decision at every step."
- id: nw-12
  brand: nookwell
  kind: claim
  text: "Nookwell offers cotton bedsheet sets in two weaves. Percale is a plain weave that feels crisp and matte and sleeps cooler. Sateen feels smooth and slightly glossy, drapes more softly and feels warmer."
- id: nw-13
  brand: nookwell
  kind: insight
  text: "To explain percale and sateen: percale for hot weather and for people who like a crisp feel, sateen for people who like a smooth, cosy feel. Renters in hot cities usually lean to percale. Neither is better, so ask how the person likes a bed to feel."
- id: nw-14
  brand: nookwell
  kind: claim
  text: "Each Nookwell bedsheet set includes a fitted sheet, a flat sheet and pillow covers, in 100 percent cotton."
- id: nw-15
  brand: nookwell
  kind: claim
  text: "The move-in bundle is for new tenants. It contains a percale bedsheet set, two cushion covers and a pair of blackout curtains."
- id: nw-16
  brand: nookwell
  kind: insight
  text: "Frame the move-in bundle as everything to make the bedroom feel like yours in an afternoon. Stress that nothing in it needs drilling or leaves a mark, which matters to every tenant with a landlord."
- id: nw-17
  brand: nookwell
  kind: claim
  text: "Nookwell sheets are washed before they are cut and sewn to limit shrinkage, and the colour is set for repeated washing."
- id: nw-18
  brand: nookwell
  kind: insight
  text: "To answer worry about frequent washing, give care advice that is realistic: wash cool to warm, and do not over-dry. Never promise sheets that never fade or that last forever. Point to how the fabric behaves in customers' reviews."
- id: nw-19
  brand: nookwell
  kind: insight
  text: "When talking to short-let hosts, talk about turnaround: sheets that wash easily and dry quickly, matching spare sets, and a bed that looks fresh in the listing photographs. A host's measure is how fast a room is ready for the next guest."
- id: nw-20
  brand: nookwell
  kind: claim
  text: "Nookwell blackout curtains block most light but not all of it. Do not describe them as completely dark. Say that they cut out most of the light, which is what a tenant sleeping through early sun actually needs."
- id: nw-21
  brand: nookwell
  kind: insight
  text: "For renters who cannot drill holes, curtains hang from a tension rod or adhesive hooks. Show the setup in the pictures and say that it comes off without a mark. Say 'no drilling needed' only for a curtain shown with a rod that does not need it."
- id: nw-22
  brand: nookwell
  kind: insight
  text: "The angle for festival redecorating is small changes, big feel. Swap cushion covers and curtains for festive colours, and keep the sheets and furniture as they are. It is a refresh that costs little effort and can be put away afterwards."
- id: nw-23
  brand: nookwell
  kind: insight
  text: "Between seasons, present the seasonal cushion covers as a rotation. Keep neutral covers on the sofa year-round, store the set that is not in use, and change prints when the mood changes. Do not manufacture urgency for the next print."
- id: nw-24
  brand: nookwell
  kind: insight
  text: "Be upbeat about small spaces with specifics: lighter colours, one strong cushion, a bed made to look inviting. Avoid 'tiny' and 'cramped', and do not promise a dream flat. Upbeat is believable when it is specific."
- id: nw-25
  brand: nookwell
  kind: insight
  text: "For someone furnishing a first rented flat, lead with what changes a room fastest for least effort: bedsheets and curtains. Reassure them that it is all rental-safe and moves with them, so nothing is wasted if they move."
- id: nw-26
  brand: nookwell
  kind: insight
  text: "Nookwell's voice is friendly, unfussy and upbeat about small spaces. It talks like a friend who knows linen, not like a catalogue."
- id: nw-27
  brand: nookwell
  kind: insight
  text: "Exclamation marks are fine in Nookwell social posts, used sparingly, no more than one a post, and never on product pages or in care instructions. Contractions are welcome. It is casual, but not loud."
- id: nw-28
  brand: nookwell
  kind: insight
  text: "Nookwell is casual in the way a friendly neighbour is: 'your flat', not 'your living environment'. Avoid decor jargon and long sentences. Explain a weave or a fabric in a few plain words."
- id: nw-29
  brand: nookwell
  kind: creative
