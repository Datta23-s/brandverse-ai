# The registered evaluation run order.
#
# REGISTRATION 1, 2026-11-05, BEFORE any evaluation call: 10 brands, 30 requests, 90 runs, brand
# order B05, B07, B04, B10, B03, B01, B02, B06, B09, B08, sha256 of the order lines
# ef01900fa560d5fc8fe89a799fd06e244d53da47e20622a50e35cd34e66ae7cf. **SUPERSEDED on 2026-11-09 by
# Registration 2 below, which removes two brands and changes nothing else.** Registration 1's
# figures are kept here because a registration is superseded in the open, never edited away.
#
# REGISTRATION 2, 2026-11-09, STILL BEFORE any evaluation call (verified the same day: the live
# project holds 0 runs, 0 llm_calls, 0 campaigns, 0 approvals, 0 memory items): the evaluation runs
# **8 brands x 3 campaigns = 24 requests, 72 runs**. B09 and B10 are EXCLUDED because their research
# was never captured and cannot be, which is the owner's pre-authorised fallback of 7 November with
# its hard deadline of the end of 9 November. The reason, the measurement behind it and what was
# deliberately NOT done instead are in backend/app/evaluation/schedule.py (EXCLUDED_BRANDS) and
# docs/evaluation-plan.md; the short version: the snapshot holds R01 to R25, four recording sessions
# failed on the same cause, and with the declared engine `yep` hard down the other three must answer
# every query of a request, which measured at about 6e-5 per request on 9 November.
#
# NOTHING ELSE CHANGED, and that is checkable: the SEED, the method and the arm order are
# Registration 1's, so the 72 lines below are Registration 1's 90 lines with B09's and B10's 18
# removed, in the same sequence, and the eight surviving brands keep their original relative order
# (B05, B07, B04, B03, B01, B02, B06, B08: B10 and B09 simply drop out). A hash ordering is stable
# under removal, so no surviving request was re-shuffled by the exclusion.
# `backend/tests/test_run_order.py` asserts all of it.
#
# Owner ruling (5 November 2026): the evaluation does not run arm by arm. For each request the three
# arms run ADJACENTLY, and the order is randomised with a recorded seed, so a provider outage lands
# across arms rather than inside one (the 5 November outage hit whichever run was in flight).
#
# Generated by app/evaluation/schedule.py (interleaved_order, seed below); backend/tests/
# test_run_order.py recomputes it from the code and the test set and fails on any difference. To
# change it is a new dated registration, never an edit, and impossible after the first evaluation call.
#
# What is randomised (see the module docstring for why): the brand blocks; the order of the three
# arms inside each request. What is NOT: a brand's campaigns keep their registered position 1, 2, 3,
# because campaign 2 and 3 read the memory that the earlier approved campaigns wrote (test_set.yaml
# campaign_pattern). A shuffle of all the requests would change what the Proposed arm remembers.
#
# DO NOT "FIX" THIS BY SHUFFLING THE CAMPAIGNS WITHIN A BRAND. Owner, 2026-11-05: "Campaigns 1, 2 and
# 3 are the memory progression and a full shuffle would destroy what the experiment measures." The
# in-brand order is the experiment's independent variable (cold start, then memory from one
# campaign, then from two), not noise to be randomised away.
#
# Method: each item is sorted by sha256("<seed>|<label>"), labels "brand:B05" and "arm:R13:proposed".
# No pseudo-random generator, no library version: anyone can recompute it by hand.
