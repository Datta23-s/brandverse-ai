# Local services on the worker host (Architecture.md §11: the laptop is the worker host).
# Start with:  docker compose up -d redis searxng
name: brandverse

services:
  redis:
    # Version verified on the laptop 2026-10-14 (Architecture.md §11).
    image: redis:7.4-alpine
    # AOF on so queued ARQ jobs and run-progress streams survive a laptop restart.
    # appendfsync everysec: at most one second of writes lost on a crash.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      # Bound to localhost only: nothing on the network should reach the queue.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  searxng:
    # Pinned by tag AND digest (docs/searxng.md records both and when). `latest` is never used: the
    # engine set and the JSON shape are parameters of the results the thesis reports.
    image: searxng/searxng:2026.10.19-81371861f
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-dev-only-local-searxng-secret}
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
    ports:
      # Host port 8888, not 8080: 8080 is commonly held by another local service (here, httpd), and
      # Windows reserves ranges of ports at random (`netsh interface ipv4 show excludedportrange
      # protocol=tcp`). Localhost only. SEARXNG_URL=http://127.0.0.1:8888
      - "127.0.0.1:8888:8080"
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

volumes:
  redis-data:
