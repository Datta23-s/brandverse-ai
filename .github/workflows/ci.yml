name: CI

on:
  # Every branch, not only main: a branch without an open pull request must still run the
  # merge-blocking database gate (Rules.md §6) and the storage measurement step.
  push:
  pull_request:

# Runner pinned to an explicit image (2026-10-14): ubuntu-latest moves to Ubuntu 26 from
# 2026-10-19, which would change the merge-blocking gate with no commit (Rules.md A1, A6).
# Upgrading the runner is a deliberate change: its own commit, with the database gate and the
# storage measurement re-run and recorded in Architecture.md §11.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, type, test)
    runs-on: ubuntu-24.04
    services:
      redis:
        # Same image as the laptop (compose.yaml, Architecture.md §11).
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # The queue, the worker and the SSE stream are tested against real Redis; a missing Redis
      # fails the job rather than skipping those tests.
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
      REQUIRE_REDIS_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          working-directory: backend
      - name: Install (locked)
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Test (no database)
        run: uv run pytest -q -m "not db"

  database:
    # Merge-blocking (Rules.md §6): tenant isolation, RBAC, approval and audit-log guarantees,
    # tested against the real migrations on real pgvector + pg_trgm. Make this a required status
    # check in branch protection.
    name: Database (RLS, merge-blocking)
    runs-on: ubuntu-24.04
    services:
      postgres:
        # pgvector/pgvector:pg17, pinned by multi-arch digest (tag last updated 2026-10-01)
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REQUIRE_DB_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          working-directory: backend
      - name: Install (locked)
        run: uv sync --locked
      - name: Database tests
        run: uv run pytest -q -m db
      - name: Measure memory_items storage (report only)
        # One-off sizing on real pgvector: per-row heap, TOAST, HNSW and other indexes
        # (Architecture.md §11, Supabase free tier 500 MB). Read the numbers from this step's log.
        run: uv run python scripts/measure_memory_storage.py --rows 10000 --chars 400

  frontend:
    name: Frontend (lint, type, test, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install (locked)
        run: npm ci
      - name: Lint
        run: npm run lint -w frontend
      - name: Type check
        run: npm run typecheck -w frontend
      - name: Test (Vitest)
        run: npm run test -w frontend
      - name: Build
        run: npm run build -w frontend

  e2e:
    # Phases.md Phase 1 exit criterion, checked on every push: the fake pipeline animates in a
    # real browser, against the real API, ARQ worker and Redis (no database: fake runs need none).
    name: End to end (Playwright, live stack)
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          working-directory: backend
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install backend (locked)
        working-directory: backend
        run: uv sync --locked
      - name: Install frontend (locked)
        run: npm ci
      - name: Install Chromium
        run: npm exec -w frontend -- playwright install --with-deps chromium
      - name: Build frontend
        run: npm run build -w frontend
      - name: Start API and worker
        working-directory: backend
        run: |
          nohup uv run python -m app.api > "$RUNNER_TEMP/api.log" 2>&1 &
          nohup uv run python -m app.workers > "$RUNNER_TEMP/worker.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/api.log"; exit 1
      - name: Playwright
        run: npm run test:e2e -w frontend
      - name: Service logs
        if: always()
        run: |
          echo "--- api"; cat "$RUNNER_TEMP/api.log" || true
          echo "--- worker"; tail -n 50 "$RUNNER_TEMP/worker.log" || true
