name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, type, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          working-directory: backend
      - name: Install (locked)
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Test (no database)
        run: uv run pytest -q -m "not db"

  database:
    # Merge-blocking (Rules.md §6): tenant isolation, RBAC, approval and audit-log guarantees,
    # tested against the real migrations on real pgvector + pg_trgm. Make this a required status
    # check in branch protection.
    name: Database (RLS, merge-blocking)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector:pg17, pinned by multi-arch digest (tag last updated 2026-10-01)
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REQUIRE_DB_TESTS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          working-directory: backend
      - name: Install (locked)
        run: uv sync --locked
      - name: Database tests
        run: uv run pytest -q -m db
      - name: Measure memory_items storage (report only)
        # One-off sizing on real pgvector: per-row heap, TOAST, HNSW and other indexes
        # (Architecture.md §11, Supabase free tier 500 MB). Read the numbers from this step's log.
        run: uv run python scripts/measure_memory_storage.py --rows 10000 --chars 400

  frontend:
    # Phase 0: workspace + lockfile validation only. Lint, type check, test and build
    # steps are added in Phase 1 with the Next.js app.
    name: Frontend (workspace install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install (locked)
        run: npm ci
