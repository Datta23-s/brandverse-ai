# refused. If an account turns out to be linked: leave it null, everything stops, reassess spend.
# BASIS (4 November 2026): gcloud VERIFICATION, not only the owner's statement. `gcloud billing projects
# describe gen-lang-client-0622579315` (display name brandverse-ai, created 2026-10-17) printed
