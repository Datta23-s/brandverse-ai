# Superlatives and "first" claims (Rules.md T3), for the risk gate (backend/app/core/gates.py).
#
# TIER SPLIT DECIDED 2026-10-18 by the project owner, word by word, before any evaluation run or
# report used this list — the same reason as the attempt rule (docs/evaluation-plan.md §2): a
# vocabulary chosen after seeing results is choosing the results. This file is now fixed: its hash
# is in versions.lock, and any change is a new version (v2.yaml), recorded in every gate report.
#
# Two tiers:
#   block — unambiguous superlative: no supporting citation -> the copy is BLOCKED.
#   flag  — context-dependent ("leading to", "the only way", "the ultimate guide"): no supporting
#           citation -> FLAGGED for the human reviewer, not blocked.
# Either tier passes when the statement containing the phrase cites an active verified claim whose
# own text contains the same phrase. A flag-tier phrase that occurs only inside a matched
# block-tier phrase ("leading" in "market leading") is reported once, at the block tier.
#
# Matching (app/core/text_match.py): whole words, case- and punctuation-insensitive; each gap
# between a phrase's words may be a space, a hyphen or dash, or nothing ("best selling" matches
# "best-selling", "best–selling", "bestselling"); "#1", "Nr. 1", "No.1", "No. 1" all read as
# "no 1". Families are ENUMERATED, never written as patterns: "most \w+" would block "most people",
# and an unlisted surprise cannot be versioned.
#
# AMENDED 2026-10-18, same day, still before any evaluation use, by the project owner: "best in
# class" added to the block tier (30 block). It is one of the commonest superlatives in Indian
# marketing copy and was not caught: "best" alone matched "best in class", but not the closed
# "bestinclass". With separator tolerance, "best-in-class" and "bestinclass" now match too.
#
# KNOWN FALSE POSITIVES, CHOSEN, NOT MISSED — accepted costs of a word-by-word list, following from
# the owner's rulings: "no 1-year warranty" blocks (reads as "no 1"); "Best beforehand" blocks
# ("beforehand" is not "before", so the best-before exception does not apply). Checked and correct:
# "bestow" does NOT match "best" (whole words only).
#
# DELIBERATELY NOT HERE — evidence and safety claims, not superlatives: "clinically proven",
# "scientifically proven", "doctor recommended", "zero side effects", "100% safe". They belong to
# the claim gate, which resolves them against a verified claim or blocks them. A phrase in two
# gates is counted twice and the findings table stops adding up. Do not add them here.
version: v1
block:
  - phrase: best
    unless_followed_by: [before]   # a best-before date is not a superlative
  - finest
  - greatest
  - fastest
  - strongest
  - cheapest
  - safest
  - purest
  - number one
  - no 1
  - first ever
  - world's first
  - india's first
  - most advanced
  - most powerful
  - most effective
  - most trusted
  - most recommended
  - highest potency
  - highest quality
  - unbeatable
  - unmatched
  - unrivalled
  - unrivaled
  - unparalleled
  - market leading
  - industry leading
  - top rated
  - best selling
  - best in class   # added 2026-10-18 (see header)
flag:
  - leading
  - the only
  - ultimate
  - the first
  - perfect
  - ideal
  - superior
  - unique
  - revolutionary
  - world class
  - top quality
