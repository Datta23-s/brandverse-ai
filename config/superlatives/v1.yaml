# Superlatives and "first" claims (Rules.md T3), for the risk gate (backend/app/core/gates.py).
#
# DRAFT, awaiting the project owner's word-by-word decision on the tier split (2026-10-18). v1
# has not been used by any evaluation run or report; once decided, this file and its line in
# versions.lock are fixed, and any later change is a new version (v2.yaml).
#
# Two tiers, one version, one hash:
#   block — unambiguous superlative: no supporting citation -> the copy is BLOCKED.
#   flag  — context-dependent ("leading to", "the only way", "the ultimate guide"): no supporting
#           citation -> FLAGGED for the human reviewer, not blocked.
# Either tier passes when the statement containing the phrase cites an active verified claim whose
# own text contains the same phrase. A flag-tier phrase that occurs only inside a matched
# block-tier phrase ("leading" in "market leading") is reported once, at the block tier.
#
# A phrase matches as whole words, case- and punctuation-insensitively (app/core/text_match.py).
version: v1
block:
  - best
  - finest
  - greatest
  - fastest
  - strongest
  - cheapest
  - number one
  - first ever
  - world's first
  - india's first
  - most advanced
  - most powerful
  - most effective
  - unbeatable
  - unmatched
  - unrivalled
  - unrivaled
  - unparalleled
  - market leading
  - industry leading
  - top rated
  - best selling
flag:
  - leading
  - the only
  - ultimate
  - the first
  - no 1
  - perfect
  - ideal
  - superior
  - unique
  - revolutionary
  - world class
  - top quality
