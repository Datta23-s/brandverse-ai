# The M-score (Memory.md §3.1): reuse decision over memory candidates (backend/app/memory/scoring.py).
#
# DEFAULTS, NOT TUNED. Tuned in Phase 10 against the frozen relevance labels; defaults and tuned
# values are both reported (Rules.md A5). Every number here is a parameter of the results.
#
# Missing components are LEFT OUT and the remaining weights renormalised — never filled with a
# neutral guess — and the breakdown names what was left out:
#   C (customer match) needs persona vectors, which arrive with A3 in Phase 6;
#   E (evidence quality) needs a stored source score, which arrives with source scoring in Phase 5.
version: defaults-2026-10-18
memory:
  weights: {S: 0.30, P: 0.20, C: 0.15, A: 0.15, F: 0.10, E: 0.10}
  # S: cosine similarity of query and item embeddings, clamped to [0, 1]. Not (1 + cos) / 2, which
  # would lift unrelated items (cos ~ 0.3) to 0.65, the floor of the reuse bands.
  product_match: {same_product: 1.0, same_brand: 0.7, same_category: 0.4, other: 0.1}
  sector_alignment: {same: 1.0, adjacent: 0.6, unrelated: 0.2}
  # Pairs of sector keys counted as adjacent. None declared yet: every other sector is unrelated.
  adjacent_sectors: []
  freshness_lambda: 0.7          # F = exp(-lambda * age_days / freshness_days)
  default_freshness_days:        # when an item states none (Memory.md §2)
    persona: 180
    competitor: 60
    insight: 365
    claim: 365
    creative: 180
    sector: 365
  bands: {reuse: 0.90, adapt: 0.80, support: 0.65}   # Memory.md §3.2
writeback:
  # Applied when a run's staged memory commits (backend/app/memory/writeback.py).
  near_duplicate_cosine: 0.95    # Memory.md §6.1 rule 4: above it, reinforce the existing item
  reuse_confidence_step: 0.02    # Memory.md §6.3
  confidence_cap: 0.99           # Memory.md §6.3
  correction_step: 0.15          # Memory.md §6.3: a validation flag or a reviewer's edit-out
  revoke_below: 0.30             # Memory.md §6.3: below it the item is revoked by rule (0024)
  # One memory item is one fact, never split (Memory.md §5, decided 2026-10-19): half a fact can be
  # retrieved and cited as if it were whole. A candidate over this many tokens (the encoder's own
  # count) is refused and the refusal recorded; the author splits it into separate facts upstream.
  max_item_tokens: 400
retrieval:
  # HNSW search depth, set per transaction before app.match_memory (backend/app/memory/retrieval.py)
  # and logged with every retrieval. A parameter of the results: evaluation reports retrieval
  # quality against it and Phase 6 reports latency against it. pgvector accepts 1..1000. Below 60
  # it also truncates the vector branch (limit 60) to ef_search rows, since iterative index scans
  # are off; a sweep below 60 measures that too.
  hnsw_ef_search: 100                                  # Memory.md §4.3
research:
  # How long a cached search result may be reused (backend/app/research/search_cache.py, Rules.md
  # C7). A parameter of the results, not a constant: search results change, the thesis measures
  # freshness, and an entry reused across days changes what a run saw. Every run records the TTL
  # in force and the age of each entry it reused. DEFAULT, NOT TUNED. An entry older than the TTL
  # in force is a miss even if Redis still holds it, so lowering this takes effect immediately.
  search_cache_ttl_s: 86400                            # one day
  # A search answered while some engines failed (a degraded answer, docs/searxng.md) is a transient
  # failure, so one bad minute must not poison a day of runs: it is cached, marked degraded, for
  # this much shorter time (owner, 2026-10-26). Evaluation recording does not cache a degraded
  # search at all (docs/evaluation-plan.md section 8). Never longer than search_cache_ttl_s.
  search_cache_degraded_ttl_s: 3600                    # one hour
  # The engines the search configuration is DECLARED to be, in advance, reported beside every result
  # (owner, 2026-10-26): "degraded" means one of these failed, not that an engine SearXNG could have
  # run did. NOT DECLARED YET (null): the rate probe decides it from what actually answers, and the
  # declaration is recorded in docs/evaluation-plan.md section 8 with its evidence before any
  # recording. While null every engine SearXNG names counts, and the evaluation harness (when it
  # exists) refuses to start. Never edited to make a run look complete.
  declared_engines: null
  # Page-content extraction (backend/app/research/extraction.py). Main text shorter than the
  # minimum is no content (a login wall, a listing): the page is refused rather than passed on as
  # evidence. Longer than the maximum is cut at a paragraph boundary and flagged `truncated`, so no
  # single page fills an agent's context. DEFAULTS, NOT TUNED.
  extraction_min_chars: 200
  extraction_max_chars: 20000
  # The page fetcher (backend/app/research/fetch.py). Raw page bodies live in Redis under this TTL
  # and nowhere else (zero-retention, Architecture.md section 6): an entry older than the TTL in
  # force is a miss even if Redis still holds it. A body over the byte cap is REFUSED, not cut: half
  # a page is not a page. The user agent says what the fetcher is. DEFAULTS, NOT TUNED.
  page_cache_ttl_s: 3600                               # one hour
  fetch_timeout_s: 10.0
  fetch_total_timeout_s: 20.0
  fetch_max_bytes: 2000000                             # 2 MB
  fetch_max_redirects: 5
  fetch_user_agent: "BrandverseResearch/0.1 (academic research project)"
  # Per-host politeness (fetch.py): at least this long between two requests started to the same
  # host, whatever they are for. Different hosts do not wait for each other. DEFAULT, NOT TUNED.
  fetch_host_delay_s: 1.0
  # robots.txt is honoured (backend/app/research/fetch.py, robots.py): one fetch per origin, kept this
  # long (RFC 9309 allows up to a day), and only the first robots_max_bytes of it read (the RFC asks
  # for at least 500 KiB). The agent token is the User-Agent's first word.
  robots_ttl_s: 86400
  robots_max_bytes: 524288
source:
  # Source scoring (backend/app/research/source_scoring.py; Architecture.md §6.2): how far one web
  # page is trusted as evidence, in [0, 1]. DEFAULTS, NOT TUNED: every number here is a parameter of
  # the results and is reported (Rules.md A5). Three factors; CORROBORATION IS NOT MODELLED (decided
  # 2026-10-25, Memory.md §3.1): it would need a bonus with no principled value. An item backed by
  # several pages takes the MAXIMUM of their scores, so adding a source can never lower it.
  #
  # A factor that cannot be computed (a page that states no date has no recency) is left out and the
  # remaining weights renormalised, as in the M-score; the score names what was left out.
  weights: {authority: 0.40, recency: 0.25, specificity: 0.35}
  # Authority is a PRIOR about the kind of publisher, read from the host alone. It is not a
  # judgement of whether the page is right, and it does not tell a manufacturer's own site from an
  # independent one. The longest matching suffix wins; a host matching none scores `unknown`.
  authority:
    unknown: 0.50
    classes:
      - name: government_or_regulator
        score: 0.95
        suffixes: [gov, gov.in, gov.uk, gov.au, europa.eu]
      - name: academic
        score: 0.85
        suffixes: [edu, edu.in, edu.au, ac.in, ac.uk]
      - name: social_or_user_generated
        score: 0.25
        suffixes: [reddit.com, quora.com, facebook.com, instagram.com, x.com, twitter.com, pinterest.com, tiktok.com, youtube.com]
  # Recency halves every this many days from the page's own stated date: 0.5 ** (age / half_life).
  recency_half_life_days: 365
  # Specificity: the share of the query's distinct content words found, as whole words, in the
  # page's title and text. English function words are ignored; language detection is unverified
  # (Phases.md Phase 5), so this is an English-only default.
  specificity_min_word_chars: 3
  specificity_ignore_words: [the, and, for, are, was, were, with, that, this, from, how, what, why, when, where, who, which, our, your, their, can, could, should, would, does, did, has, have, had, not, but, you, its, any, all]
  # A page scoring below this is discarded before it reaches an agent (Phases.md Phase 5 exit).
  accept_at_or_above: 0.40
