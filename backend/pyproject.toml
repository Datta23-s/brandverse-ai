[project]
name = "brandverse-api"
version = "0.1.0"
description = "BrandverseAI API gateway, orchestrator and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arq>=0.28.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "litellm>=1.105.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["T201"]   # report scripts print their results

[tool.mypy]
python_version = "3.12"
files = ["app"]

# PyYAML ships no type information; the parsed document is validated by Pydantic
# (app/llm/registry.py), so nothing typed flows from the untyped call.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

# The local encoder's libraries are in the optional `embeddings` group, which CI does not install;
# app/memory/embeddings.py imports them only inside LocalEncoder.load.
# trafilatura is in the optional `extraction` group, which CI does not install; the module imports it
# only inside trafilatura_extract.
[[tool.mypy.overrides]]
module = ["trafilatura", "trafilatura.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.core.*", "app.agents.*", "app.evaluation.*", "app.api.*", "app.workers.*", "app.models.*", "app.llm.*", "app.research.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: needs PostgreSQL with pgvector (TEST_DATABASE_URL); merge-blocking in CI",
    "redis: needs a Redis server (REDIS_TEST_URL, default 127.0.0.1 db 15); required in CI",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
embeddings = [
    "sentence-transformers>=6.1.0",
]
# Page-content extraction (Phase 5). Optional like `embeddings`: CI never installs it and tests
# extraction against recorded outputs (tests/fixtures/extraction). trafilatura approved explicitly
# by the project owner 2026-10-25; it resolves to 11 packages including lxml (a compiled wheel).
extraction = [
    "trafilatura==2.3.1",
]
