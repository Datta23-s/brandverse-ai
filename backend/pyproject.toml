[project]
name = "brandverse-api"
version = "0.1.0"
description = "BrandverseAI API gateway, orchestrator and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arq>=0.28.0",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["T201"]   # report scripts print their results

[tool.mypy]
python_version = "3.12"
files = ["app"]

[[tool.mypy.overrides]]
module = ["app.core.*", "app.agents.*", "app.evaluation.*", "app.api.*", "app.workers.*", "app.models.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: needs PostgreSQL with pgvector (TEST_DATABASE_URL); merge-blocking in CI",
    "redis: needs a Redis server (REDIS_TEST_URL, default 127.0.0.1 db 15); required in CI",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
