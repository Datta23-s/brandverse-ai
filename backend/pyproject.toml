[project]
name = "brandverse-api"
version = "0.1.0"
description = "BrandverseAI API gateway, orchestrator and worker"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["app"]

[[tool.mypy.overrides]]
module = ["app.core.*", "app.agents.*", "app.evaluation.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: needs PostgreSQL with pgvector (TEST_DATABASE_URL); merge-blocking in CI",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
