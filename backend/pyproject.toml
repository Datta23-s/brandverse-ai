[project]
name = "brandverse-api"
version = "0.1.0"
description = "BrandverseAI API gateway, orchestrator and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arq>=0.28.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-postgres>=3.2.0",
    "litellm>=1.105.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["T201"]   # report scripts print their results

[tool.mypy]
python_version = "3.12"
# `app`, and the scripts that RUN or REPORT the evaluation (owner, 7 November 2026). The other
# scripts (probes, recording, posture) are not on that path and carry 15 files' worth of errors
# the owner has not ruled on: see decision-log 2.51.
files = [
  "app",
  "scripts/phase7_stage2.py",
  "scripts/phase7_decomposition.py",
  "scripts/evaluation_dry_run.py",
  "scripts/freeze_rating_amendment.py",
  "scripts/phase7_count_predictions.py",
  "scripts/chunk_f_first_campaign.py",
  "scripts/chunk_f_agreement_round.py",
]
# `scripts` is a namespace package that other scripts also import by bare name; without this mypy
# finds a file under two module names.
explicit_package_bases = true
mypy_path = "."

# PyYAML ships no type information; the parsed document is validated by Pydantic
# (app/llm/registry.py), so nothing typed flows from the untyped call.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

# The local encoder's libraries are in the optional `embeddings` group, which CI does not install;
# app/memory/embeddings.py imports them only inside LocalEncoder.load.
# trafilatura is in the optional `extraction` group, which CI does not install; the module imports it
# only inside trafilatura_extract.
[[tool.mypy.overrides]]
module = ["trafilatura", "trafilatura.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.core.*", "app.agents.*", "app.evaluation.*", "app.api.*", "app.workers.*", "app.models.*", "app.llm.*", "app.research.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test stuck over 5 minutes is KILLED and its stack printed (pytest-timeout, approved by the owner
# 2026-11-03 as a dev dependency: the earlier faulthandler dump alone could not stop a hang).
timeout = 300
timeout_method = "thread"
pythonpath = ["."]
markers = [
    "db: needs PostgreSQL with pgvector (TEST_DATABASE_URL); merge-blocking in CI",
    "redis: needs a Redis server (REDIS_TEST_URL, default 127.0.0.1 db 15); required in CI",
    "real_provider: may call a real model provider; also needs the test named in tests/conftest.py",
    "real_encoder: may load the real encoder; also needs the test named in tests/conftest.py",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.0",
]
embeddings = [
    "sentence-transformers>=6.1.0",
]
# Page-content extraction (Phase 5). Optional like `embeddings`: CI never installs it and tests
# extraction against recorded outputs (tests/fixtures/extraction). trafilatura approved explicitly
# by the project owner 2026-10-25; it resolves to 11 packages including lxml (a compiled wheel).
extraction = [
    "trafilatura==2.3.1",
]
